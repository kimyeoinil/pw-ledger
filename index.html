async function auth(body,grant){const r=await fetch(SU+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('auth');const j=await r.json();SES={a:j.access_token,r:j.refresh_token,x:Date.now()+(j.expires_in-60)*1000};localStorage.setItem('pwS',JSON.stringify(SES));}

 if(id=g('u')){photoFor=id;file.value='';file.click();return;}
 if(id=g('h')){const h=await api('/rest/v1/history?select=action,side,at,new&entry_id=eq.'+id+'&order=id.asc');document.getElementById('h'+id).innerHTML='<div style="margin-top:6px">'+h.map(x=>`${new Date(x.at).toLocaleString()} · ${x.side==='ADMIN'?t('KR'):t(x.side)} · ${x.action} · ${fm(amt(x.new))} · KR${x.new.ok_kr?'✔':'–'} CN${x.new.ok_cn?'✔':'–'}${x.new.deleted?' ['+t('deleted')+']':''}`).join('<br>')+'</div>';return;}
 if(id=g('p')){const r=await api('/storage/v1/object/sign/evidence/'+id,{method:'POST',body:JSON.stringify({expiresIn:600})});window.open(SU+'/storage/v1'+r.signedURL,'_blank');return;}
 if(id=g('x')){ev.target.closest('tr').classList.toggle('open');}
 }catch(e){toast(e.message)}};
file.onchange=async()=>{const f=file.files[0];if(!f||!photoFor)return;const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=photoFor+'/'+Date.now()+'.'+ext;
 try{const a=await tok();const r=await fetch(SU+'/storage/v1/object/evidence/'+path,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+a,'Content-Type':f.type||'application/octet-stream'},body:f});if(!r.ok)throw new Error(t('err')+' '+r.status);
 const e=E.find(x=>x.id===photoFor);await patch(photoFor,{photos:[...(e.photos||[]),path]});toast(t('saved'));}catch(e){toast(e.message)}};
const addRowF=(x=['',1,''])=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<input value="${esc(x[0])}"><input type="number" step="any" value="${x[1]}"><input type="number" step="any" value="${x[2]}"><button type="button" class="btn">×</button>`;d.lastChild.onclick=()=>d.remove();rows.appendChild(d)};
addRow.onclick=()=>addRowF();
function openDlg(e){editing=e||null;apply();dlgT.textContent=e?t('editT'):t('newT');fType.innerHTML=['cn_goods','kr_goods','cn_pay','kr_pay'].map(k=>`<option value="${k}">${t(k)}</option>`).join('');
 rows.innerHTML='';(e?e.items:[['',1,'']]).forEach(addRowF);fDate.value=e?e.date:new Date().toISOString().slice(0,10);fType.value=e?e.type:(ME==='CN'?'cn_goods':'kr_goods');
 fTitle.value=e?pick(e.title):'';fCur.value=e?e.cur:(ME==='CN'?'CNY':'KRW');fCn.value=e&&e.cn_amount!=null?e.cn_amount:'';fNote.value=e?pick(e.note):'';dlg.showModal();}
add.onclick=()=>openDlg(null);
dlg.addEventListener('close',async()=>{if(dlg.returnValue!=='ok')return;const items=[...rows.children].map(r=>{const i=r.querySelectorAll('input');return[i[0].value.trim(),+i[1].value||0,+i[2].value||0]}).filter(x=>x[2]);if(!items.length)return;
 const body={date:fDate.value,type:fType.value,title:fTitle.value.trim()||t(fType.value),items,cur:fCur.value,note:fNote.value.trim(),cn_amount:fCn.value===''?null:+fCn.value};
 try{if(editing){await patch(editing.id,body);}else{const r=await api('/rest/v1/entries',{method:'POST',body:JSON.stringify(body)});E.push(r[0]);E.sort((a,b)=>a.date.localeCompare(b.date));render();}toast(t('saved'));}catch(e){toast(e.message)}});
csv.onclick=()=>{const head=['date','type','title','items','currency','amount','krw','by','ok_kr','ok_cn','deleted','note'];const lines=[head.join(',')].concat(E.map(e=>[e.date,t(e.type),pick(e.title),(e.items||[]).map(x=>x[0]+' '+x[1]+'x'+x[2]).join(' / '),e.cur,amt(e),Math.round(krw(e)*sign[e.type]),e.by_side,e.ok_kr,e.ok_cn,e.deleted,pick(e.note)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')));
 const b=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ledger_'+new Date().toISOString().slice(0,10)+'.csv';a.click();};
setInterval(()=>{if(SES&&!dlg.open&&document.visibilityState==='visible')load().catch(()=>{})},60000);
show();
</script></body></html>
