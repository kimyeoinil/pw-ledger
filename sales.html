<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>펫웰비 한국 판매관리</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f4f6fa;color:#1d2433;font-size:14px}
header{background:#14532d;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

main{max-width:1150px;margin:0 auto;padding:12px 14px 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px #0001}.card .l{color:#667;font-size:12px}.card .v{font-size:18px;font-weight:700;margin-top:4px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.btn{border:1px solid #c7cfdd;background:#fff;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px}.btn.p{background:#15803d;color:#fff;border-color:#15803d}.btn.d{color:#b3261e;border-color:#e3b3b0}
select,input{padding:6px;border:1px solid #c7cfdd;border-radius:6px;font-size:14px}

td.n,th.n{text-align:right;white-space:nowrap}tr.tot td{font-weight:700;background:#f3faf4}tr.del td{text-decoration:line-through;color:#999}
.neg{color:#b3261e}.pos{color:#15803d}.sub{font-size:12px;color:#667}h3{margin:16px 0 6px;font-size:15px}
dialog{border:none;border-radius:12px;padding:0;width:min(640px,96vw)}dialog form{padding:16px}dialog label{display:block;font-size:12px;color:#556;margin-top:8px}dialog input,dialog select{width:100%}
.row{display:grid;grid-template-columns:2.2fr .8fr 1fr auto;gap:6px;margin-top:4px}.row select,.row input{width:100%}

@media(max-width:700px){body{font-size:13px}th,td{padding:6px 4px}.hm{display:none}}
</style><script>const APPV='20261105c';fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const APPV='([^']+)'/);if(m&&m[1]!==APPV&&!sessionStorage.getItem('rl'+m[1])){sessionStorage.setItem('rl'+m[1],'1');location.replace(location.pathname+'?v='+m[1]);}}).catch(()=>{});</script></head><body>
<header><h1>펫웰비 한국 판매관리 <span class="sub" style="color:#cfe">(한국 계정 전용)</span></h1><div><a href="index.html">← 정산장부</a> · 환율 <b id="rateV"></b>원/위안 · <a href="#" id="lo">로그아웃</a></div></header>
<div id="gate"><h3 style="margin-top:0">로그인 (한국 계정)</h3><input id="gid" placeholder="아이디" autocomplete="username" style="width:100%;margin-top:6px" value="korea"><input id="gpw" type="password" placeholder="비밀번호" autocomplete="current-password" style="width:100%;margin-top:8px"><button class="btn p" id="gbtn" style="width:100%;margin-top:12px;padding:10px">로그인</button><div id="gerr" style="color:#c00;margin-top:8px;font-size:13px"></div></div>
<nav id="nav" style="display:none"><button data-tab="sum" class="on">월별 요약</button><button data-tab="sales">판매</button><button data-tab="pay">입금</button><button data-tab="cust">거래처</button><button data-tab="prod">품목·재고</button></nav>
<main id="main" style="display:none"></main>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<div class="msg" id="msg"></div>
<script>
const SU='https://vcxnkcemuuvlkxmcisvc.supabase.co',SK='sb_publishable_L3zIF2WHYk4tdBa6iaSTyg_38Ok6RKW';
let SES=JSON.parse(localStorage.getItem('pwS')||'null'),TAB='sum',D={},RATE=200,MONTH='';
const fm=n=>Math.round(+n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=s=>{msg.textContent=s;msg.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>msg.style.display='none',2200)};
async function tok(){if(!SES)throw new Error('login');if(Date.now()>SES.x){const r=await fetch(SU+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.r})});if(!r.ok){SES=null;localStorage.removeItem('pwS');throw new Error('login');}const j=await r.json();SES={a:j.access_token,r:j.refresh_token,x:Date.now()+(j.expires_in-60)*1000};localStorage.setItem('pwS',JSON.stringify(SES));}return SES.a;}
async function api(p,o={}){const a=await tok();const r=await fetch(SU+p,{...o,headers:{apikey:SK,Authorization:'Bearer '+a,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});if(!r.ok)throw new Error('오류 '+r.status+' '+(await r.text()).slice(0,140));const t=await r.text();return t?JSON.parse(t):null;}
async function load(){
 const uid=JSON.parse(atob(SES.a.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;
 const [m,pr,cu,pc,sa,pa,ad,en,st]=await Promise.all([api('/rest/v1/members?select=side,user_id'),api('/rest/v1/kr_products?select=*&order=sort.asc,id.asc'),api('/rest/v1/kr_customers?select=*&order=id.asc'),api('/rest/v1/kr_prices?select=*'),api('/rest/v1/kr_sales?select=*&order=date.asc,created_at.asc'),api('/rest/v1/kr_payments?select=*&order=date.asc,created_at.asc'),api('/rest/v1/kr_stock_adj?select=*&order=date.asc'),api('/rest/v1/entries?select=id,date,type,items,deleted&type=eq.cn_goods&deleted=eq.false'),api('/rest/v1/settings?select=*&key=eq.rate')]);
 const me=(m.find(x=>x.user_id===uid)||{}).side; if(me!=='KR'){gate.style.display='block';return false;}
 if(st[0])RATE=+st[0].value; D={pr,cu,pc,sa,pa,ad,en}; rateV.textContent=RATE; return true;}
const P=id=>D.pr.find(p=>p.id==id)||{name:'?',unit:''},C=id=>D.cu.find(c=>c.id==id)||{name:'(미지정)'};
const saleAmt=s=>(s.items||[]).reduce((a,i)=>a+(+i.q||0)*(+i.price||0),0),saleCost=s=>(s.items||[]).reduce((a,i)=>a+(+i.q||0)*(+i.cost_cny||0)*RATE,0);
const ym=d=>d.slice(0,7),liveS=()=>D.sa.filter(s=>!s.deleted),liveP=()=>D.pa.filter(p=>!p.deleted);
function stock(){const r={};D.pr.forEach(p=>r[p.id]={in:0,out:0,adj:0});const un={};
 for(const e of D.en)for(const it of e.items||[]){const name=it[0];const p=D.pr.find(p=>(p.aliases||[]).includes(name));if(!p){(un[name]=un[name]||[]).push(e.date+' '+it[1]);continue;}if(!p.is_ignore)r[p.id].in+=+it[1]||0;}
 for(const s of liveS())for(const i of s.items||[])if(r[i.p])r[i.p].out+=+i.q||0;
 for(const a of D.ad)if(r[a.product_id])r[a.product_id].adj+=+a.qty||0;return {r,un};}
function months(){const s=new Set([...liveS().map(x=>ym(x.date)),...liveP().map(x=>ym(x.date))]);return [...s].sort();}
function vSum(){const ms=months();let cumS=0,cumP=0;const rows=ms.map(m=>{const ss=liveS().filter(s=>ym(s.date)===m),ps=liveP().filter(p=>ym(p.date)===m);const a=ss.reduce((x,s)=>x+saleAmt(s),0),c=ss.reduce((x,s)=>x+saleCost(s),0),p=ps.reduce((x,y)=>x+(+y.amount),0);cumS+=a;cumP+=p;return {m,a,c,p,rec:cumS-cumP};});
 const tA=rows.reduce((x,r)=>x+r.a,0),tC=rows.reduce((x,r)=>x+r.c,0),tP=rows.reduce((x,r)=>x+r.p,0);const cur=rows[rows.length-1]||{a:0,c:0,p:0,rec:0,m:'-'};
 const byC=D.cu.map(c=>{const a=liveS().filter(s=>s.customer_id==c.id).reduce((x,s)=>x+saleAmt(s),0),p=liveP().filter(y=>y.customer_id==c.id).reduce((x,y)=>x+(+y.amount),0);return {c,a,p,rec:a-p};}).filter(x=>x.a||x.p);
 const byP={};liveS().forEach(s=>(s.items||[]).forEach(i=>{const k=i.p;byP[k]=byP[k]||{q:0,a:0,c:0};byP[k].q+=+i.q;byP[k].a+=i.q*i.price;byP[k].c+=i.q*(i.cost_cny||0)*RATE;}));
 return `<div class="cards"><div class="card"><div class="l">이번 달(${cur.m}) 매출</div><div class="v">${fm(cur.a)}원</div></div><div class="card"><div class="l">이번 달 입금</div><div class="v">${fm(cur.p)}원</div></div>
 <div class="card"><div class="l">누적 매출 / 마진</div><div class="v">${fm(tA)}원</div><div class="sub">마진 ${fm(tA-tC)}원 (${tA?Math.round((tA-tC)/tA*100):0}%)</div></div><div class="card"><div class="l">받을 돈 (미수금)</div><div class="v ${tA-tP>0?'neg':''}">${fm(tA-tP)}원</div></div></div>
 <h3>월별</h3><table><tr><th>월</th><th class="n">매출</th><th class="n hm">원가 (중국가×${RATE})</th><th class="n">마진</th><th class="n hm">마진율</th><th class="n">입금</th><th class="n">월말 미수금</th></tr>
 ${rows.map(r=>`<tr><td>${r.m}</td><td class="n">${fm(r.a)}</td><td class="n hm">${fm(r.c)}</td><td class="n">${fm(r.a-r.c)}</td><td class="n hm">${r.a?Math.round((r.a-r.c)/r.a*100)+'%':'-'}</td><td class="n">${fm(r.p)}</td><td class="n ${r.rec>0?'neg':''}">${fm(r.rec)}</td></tr>`).join('')}
 <tr class="tot"><td>합계</td><td class="n">${fm(tA)}</td><td class="n hm">${fm(tC)}</td><td class="n">${fm(tA-tC)}</td><td class="n hm">${tA?Math.round((tA-tC)/tA*100)+'%':'-'}</td><td class="n">${fm(tP)}</td><td class="n">${fm(tA-tP)}</td></tr></table>
 <h3>거래처별</h3><table><tr><th>거래처</th><th class="n">매출</th><th class="n">입금</th><th class="n">미수금</th></tr>${byC.map(x=>`<tr><td>${esc(x.c.name)}</td><td class="n">${fm(x.a)}</td><td class="n">${fm(x.p)}</td><td class="n ${x.rec>0?'neg':''}">${fm(x.rec)}</td></tr>`).join('')||'<tr><td colspan=4 class="sub">아직 판매 기록이 없어요</td></tr>'}</table>
 <h3>품목별</h3><table><tr><th>품목</th><th class="n">판매수량</th><th class="n">매출</th><th class="n hm">원가</th><th class="n">마진</th></tr>${Object.entries(byP).map(([k,v])=>`<tr><td>${esc(P(k).name)}</td><td class="n">${fm(v.q)} ${esc(P(k).unit)}</td><td class="n">${fm(v.a)}</td><td class="n hm">${fm(v.c)}</td><td class="n">${fm(v.a-v.c)}</td></tr>`).join('')||'<tr><td colspan=5 class="sub">-</td></tr>'}</table>
 <button class="btn" id="csvM">월별 엑셀(CSV)</button>`;}
const monthSel=()=>`<select id="mSel"><option value="">전체 기간</option>${months().reverse().map(m=>`<option ${m===MONTH?'selected':''}>${m}</option>`).join('')}</select>`;
function vSales(){const ss=D.sa.filter(s=>!MONTH||ym(s.date)===MONTH).slice().reverse();
 return `<div class="bar">${monthSel()}<span style="flex:1"></span><button class="btn p" id="addSale">+ 판매 입력</button></div>
 <table><tr><th>날짜</th><th>거래처</th><th>품목</th><th class="n">금액</th><th class="n hm">마진</th><th></th></tr>${ss.map(s=>`<tr class="${s.deleted?'del':''}"><td>${s.date}</td><td>${esc(C(s.customer_id).name)}</td><td>${(s.items||[]).map(i=>`${esc(P(i.p).name)} ${fm(i.q)}×${fm(i.price)}`).join('<br>')}${s.memo?`<div class="sub">${esc(s.memo)}</div>`:''}</td><td class="n">${fm(saleAmt(s))}</td><td class="n hm">${fm(saleAmt(s)-saleCost(s))}</td><td><button class="btn" data-es="${s.id}">수정</button> <button class="btn d" data-ds="${s.id}">${s.deleted?'복구':'삭제'}</button></td></tr>`).join('')||'<tr><td colspan=6 class="sub">판매 기록이 없어요</td></tr>'}
 <tr class="tot"><td colspan=3>합계</td><td class="n">${fm(ss.filter(s=>!s.deleted).reduce((a,s)=>a+saleAmt(s),0))}</td><td class="n hm">${fm(ss.filter(s=>!s.deleted).reduce((a,s)=>a+saleAmt(s)-saleCost(s),0))}</td><td></td></tr></table>`;}
function vPay(){const ps=D.pa.filter(p=>!MONTH||ym(p.date)===MONTH).slice().reverse();
 return `<div class="bar">${monthSel()}<span style="flex:1"></span><button class="btn p" id="addPay">+ 입금 입력</button></div>
 <table><tr><th>날짜</th><th>거래처</th><th>입금자</th><th class="n">금액</th><th class="hm">메모</th><th></th></tr>${ps.map(p=>`<tr class="${p.deleted?'del':''}"><td>${p.date}</td><td>${esc(C(p.customer_id).name)}</td><td>${esc(p.payer)}</td><td class="n">${fm(p.amount)}</td><td class="hm sub">${esc(p.memo)}</td><td><button class="btn" data-ep="${p.id}">수정</button> <button class="btn d" data-dp="${p.id}">${p.deleted?'복구':'삭제'}</button></td></tr>`).join('')||'<tr><td colspan=6 class="sub">입금 기록이 없어요</td></tr>'}
 <tr class="tot"><td colspan=3>합계</td><td class="n">${fm(ps.filter(p=>!p.deleted).reduce((a,p)=>a+(+p.amount),0))}</td><td colspan=2></td></tr></table>`;}
function vCust(){return `<div class="bar"><span style="flex:1"></span><button class="btn p" id="addCust">+ 거래처 추가</button></div>
 <table><tr><th>거래처</th><th>담당자</th><th>연락처</th><th class="hm">메모</th><th>거래처별 단가</th><th></th></tr>${D.cu.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.contact)}</td><td>${esc(c.phone)}</td><td class="hm sub">${esc(c.memo)}</td><td class="sub">${D.pc.filter(x=>x.customer_id==c.id).map(x=>esc(P(x.product_id).name)+' '+fm(x.price)).join('<br>')||'정가 사용'}</td><td><button class="btn" data-ec="${c.id}">수정</button> <button class="btn" data-pcx="${c.id}">단가</button></td></tr>`).join('')||'<tr><td colspan=6 class="sub">거래처를 추가해 주세요</td></tr>'}</table>`;}
function vProd(){const {r,un}=stock();const ps=D.pr.filter(p=>!p.is_ignore);
 return `<p class="sub">입고 = 정산장부의 중국 발송(약) 자동 반영 · 원가 = 중국 단가 × 환율 ${RATE}원</p><table><tr><th>품목</th><th class="n hm">중국 단가</th><th class="n">원가</th><th class="n">정가</th><th class="n">입고</th><th class="n">판매</th><th class="n hm">조정</th><th class="n">재고</th><th></th></tr>
 ${ps.map(p=>{const s=r[p.id];const q=s.in-s.out+s.adj;return `<tr><td>${esc(p.name)} <span class="sub">${esc(p.unit)}</span></td><td class="n hm">${p.cost_cny??'-'}元</td><td class="n">${p.cost_cny!=null?fm(p.cost_cny*RATE):'-'}</td><td class="n">${p.list_price!=null?fm(p.list_price):'-'}</td><td class="n">${fm(s.in)}</td><td class="n">${fm(s.out)}</td><td class="n hm">${fm(s.adj)}</td><td class="n ${q<0?'neg':''}"><b>${fm(q)}</b></td><td><button class="btn" data-epr="${p.id}">수정</button> <button class="btn" data-adj="${p.id}">재고조정</button></td></tr>`}).join('')}</table>
 <button class="btn p" id="addProd">+ 품목 추가</button>
 ${Object.keys(un).length?`<h3>품목 연결이 필요한 중국 발송 항목</h3><p class="sub">중국이 새 이름으로 입력한 항목이에요. 어느 품목인지 고르면 재고에 반영돼요.</p><table>${Object.entries(un).map(([n,v])=>`<tr><td>${esc(n)}<div class="sub">${esc(v.join(', '))}</div></td><td><select data-map="${esc(n)}"><option value="">품목 선택…</option>${D.pr.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></td></tr>`).join('')}</table>`:''}`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));main.innerHTML={sum:vSum,sales:vSales,pay:vPay,cust:vCust,prod:vProd}[TAB]();}
function priceFor(cid,pid){if(cid==='__new')cid=null;const x=D.pc.find(x=>x.customer_id==cid&&x.product_id==pid);return x?+x.price:(P(pid).list_price??'');}
const pOpts=sel=>D.pr.filter(p=>!p.is_ignore&&p.active).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.name)}</option>`).join('');
const cOpts=sel=>`<option value="">거래처 선택…</option>`+D.cu.filter(c=>c.active).map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${esc(c.name)}</option>`).join('')+`<option value="__new" ${(!sel&&!D.cu.length)?'selected':''}>+ 새 거래처 직접 입력</option>`;
const cBox=sel=>`<select id="fc">${cOpts(sel)}</select><input id="fcNew" placeholder="새 거래처 이름 (저장하면 거래처 목록에 추가돼요)" style="margin-top:6px;display:${(!sel&&!D.cu.length)?'block':'none'}">`;
function cWire(after){fc.addEventListener('change',()=>{fcNew.style.display=fc.value==='__new'?'block':'none';if(fc.value==='__new')fcNew.focus();if(after)after();});}
async function custId(){if(fc.value==='__new'){const n=fcNew.value.trim();if(!n)throw new Error('새 거래처 이름을 넣어주세요');const ex=D.cu.find(c=>c.name===n);if(ex)return ex.id;const r=await api('/rest/v1/kr_customers',{method:'POST',body:JSON.stringify({name:n})});D.cu.push(r[0]);return r[0].id;}return fc.value?+fc.value:null;}
function openForm(html,onOk){dform.innerHTML=html+`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" value="cancel">취소</button><button class="btn p" value="ok">저장</button></div>`;dlg.onclose=async()=>{if(dlg.returnValue!=='ok')return;try{await onOk();await refresh();toast('저장됨');}catch(e){toast(e.message)}};dlg.returnValue='';dlg.showModal();}
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function saleForm(s){const it=s?s.items:[{p:D.pr[0]?.id,q:1,price:''}];
 openForm(`<h3 style="margin-top:0">${s?'판매 수정':'판매 입력'}</h3><label>날짜</label><input type="date" id="fd" value="${s?s.date:today()}"><label>거래처</label>${cBox(s?.customer_id)}
 <label>품목 / 수량 / 단가(원)</label><div id="rows"></div><button type="button" class="btn" id="ar" style="margin-top:6px">+ 품목 추가</button><label>메모</label><input id="fmemo" value="${esc(s?.memo||'')}"><div class="sub" id="ftot" style="margin-top:8px"></div>`,
 async()=>{const items=[...rows.children].map(r=>{const p=+r.querySelector('select').value;const i=r.querySelectorAll('input');return {p,q:+i[0].value||0,price:+i[1].value||0,cost_cny:P(p).cost_cny??null};}).filter(x=>x.p&&x.q);
  const body={date:fd.value,customer_id:await custId(),items,memo:fmemo.value.trim(),updated_at:new Date().toISOString()};
  if(s)await api('/rest/v1/kr_sales?id=eq.'+s.id,{method:'PATCH',body:JSON.stringify(body)});else await api('/rest/v1/kr_sales',{method:'POST',body:JSON.stringify(body)});});
 const tot=()=>{ftot.textContent='합계 '+fm([...rows.children].reduce((a,r)=>{const i=r.querySelectorAll('input');return a+(+i[0].value||0)*(+i[1].value||0)},0))+'원';};
 const addR=x=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<select>${pOpts(x.p)}</select><input type="number" step="any" value="${x.q}" placeholder="수량"><input type="number" step="any" value="${x.price}" placeholder="단가"><button type="button" class="btn">×</button>`;
  const sel=d.querySelector('select'),pi=d.querySelectorAll('input')[1];sel.onchange=()=>{pi.value=priceFor(fc.value,sel.value);tot();};if(x.price===''){pi.value=priceFor(fc.value,sel.value);}d.oninput=tot;d.lastChild.onclick=()=>{d.remove();tot();};rows.appendChild(d);tot();};
 it.forEach(addR);ar.onclick=()=>addR({p:D.pr[0]?.id,q:1,price:''});cWire(()=>{if(fc.value==='__new')return;[...rows.children].forEach(r=>{r.querySelectorAll('input')[1].value=priceFor(fc.value,r.querySelector('select').value)});tot();});}
function payForm(p){openForm(`<h3 style="margin-top:0">${p?'입금 수정':'입금 입력'}</h3><label>날짜</label><input type="date" id="fd" value="${p?p.date:today()}"><label>거래처</label>${cBox(p?.customer_id)}<label>금액(원)</label><input type="number" id="fa" value="${p?.amount??''}"><label>입금자명</label><input id="fp" value="${esc(p?.payer||'')}"><label>메모</label><input id="fmemo" value="${esc(p?.memo||'')}">`,
 async()=>{if(!(+fa.value))throw new Error('금액을 넣어주세요');const body={date:fd.value,customer_id:await custId(),amount:+fa.value||0,payer:fp.value.trim(),memo:fmemo.value.trim()};if(!body.amount)throw new Error('금액을 넣어주세요');
  if(p)await api('/rest/v1/kr_payments?id=eq.'+p.id,{method:'PATCH',body:JSON.stringify(body)});else await api('/rest/v1/kr_payments',{method:'POST',body:JSON.stringify(body)});});cWire();}
function custForm(c){openForm(`<h3 style="margin-top:0">${c?'거래처 수정':'거래처 추가'}</h3><label>거래처명</label><input id="fn" value="${esc(c?.name||'')}"><label>담당자</label><input id="fct" value="${esc(c?.contact||'')}"><label>연락처</label><input id="fph" value="${esc(c?.phone||'')}"><label>메모</label><input id="fmemo" value="${esc(c?.memo||'')}">`,
 async()=>{const body={name:fn.value.trim(),contact:fct.value.trim(),phone:fph.value.trim(),memo:fmemo.value.trim()};if(!body.name)throw new Error('거래처명을 넣어주세요');
  if(c)await api('/rest/v1/kr_customers?id=eq.'+c.id,{method:'PATCH',body:JSON.stringify(body)});else await api('/rest/v1/kr_customers',{method:'POST',body:JSON.stringify(body)});});}
function priceForm(c){const ps=D.pr.filter(p=>!p.is_ignore&&p.active);openForm(`<h3 style="margin-top:0">${esc(c.name)} 단가</h3><p class="sub">비워두면 정가를 써요.</p>${ps.map(p=>{const x=D.pc.find(x=>x.customer_id==c.id&&x.product_id==p.id);return `<label>${esc(p.name)} (정가 ${p.list_price!=null?fm(p.list_price):'-'})</label><input type="number" data-pp="${p.id}" value="${x?x.price:''}">`}).join('')}`,
 async()=>{for(const inp of dform.querySelectorAll('[data-pp]')){const pid=+inp.dataset.pp,v=inp.value;const had=D.pc.find(x=>x.customer_id==c.id&&x.product_id==pid);
  if(v==='' && had)await api(`/rest/v1/kr_prices?customer_id=eq.${c.id}&product_id=eq.${pid}`,{method:'DELETE'});
  else if(v!==''&&(!had||+had.price!==+v))await api('/rest/v1/kr_prices',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({customer_id:c.id,product_id:pid,price:+v})});}});}
function prodForm(p){openForm(`<h3 style="margin-top:0">${p?'품목 수정':'품목 추가'}</h3><label>품목명</label><input id="fn" value="${esc(p?.name||'')}"><label>단위</label><input id="fu" value="${esc(p?.unit||'')}"><label>중국 단가(위안)</label><input type="number" step="any" id="fcc" value="${p?.cost_cny??''}"><label>정가(원)</label><input type="number" id="flp" value="${p?.list_price??''}"><label>메모</label><input id="fmemo" value="${esc(p?.memo||'')}">`,
 async()=>{const body={name:fn.value.trim(),unit:fu.value.trim(),cost_cny:fcc.value===''?null:+fcc.value,list_price:flp.value===''?null:+flp.value,memo:fmemo.value.trim()};if(!body.name)throw new Error('품목명을 넣어주세요');
  if(p)await api('/rest/v1/kr_products?id=eq.'+p.id,{method:'PATCH',body:JSON.stringify(body)});else await api('/rest/v1/kr_products',{method:'POST',body:JSON.stringify({...body,sort:500})});});}
function adjForm(p){openForm(`<h3 style="margin-top:0">${esc(p.name)} 재고 조정</h3><p class="sub">늘리면 +, 줄이면 − 숫자 (예: 파손 −2, 기초재고 +10)</p><label>날짜</label><input type="date" id="fd" value="${today()}"><label>수량</label><input type="number" step="any" id="fq"><label>사유</label><input id="fr">`,
 async()=>{if(!+fq.value)throw new Error('수량을 넣어주세요');await api('/rest/v1/kr_stock_adj',{method:'POST',body:JSON.stringify({date:fd.value,product_id:p.id,qty:+fq.value,reason:fr.value.trim()})});});}
main.addEventListener('click',async ev=>{const g=k=>ev.target.closest('[data-'+k+']')?.dataset[k];let id;try{
 if(ev.target.id==='addSale')return saleForm(null);if(ev.target.id==='addPay')return payForm(null);if(ev.target.id==='addCust')return custForm(null);if(ev.target.id==='addProd')return prodForm(null);
 if(ev.target.id==='csvM'){const ms=months();const lines=['월,매출,원가,마진,입금'];ms.forEach(m=>{const ss=liveS().filter(s=>ym(s.date)===m);const a=ss.reduce((x,s)=>x+saleAmt(s),0),c=ss.reduce((x,s)=>x+saleCost(s),0),p=liveP().filter(y=>ym(y.date)===m).reduce((x,y)=>x+(+y.amount),0);lines.push([m,Math.round(a),Math.round(c),Math.round(a-c),Math.round(p)].join(','))});const b=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='kr_sales_monthly.csv';l.click();return;}
 if(id=g('es'))return saleForm(D.sa.find(x=>x.id===id));if(id=g('ep'))return payForm(D.pa.find(x=>x.id===id));if(id=g('ec'))return custForm(D.cu.find(x=>x.id==id));if(id=g('pcx'))return priceForm(D.cu.find(x=>x.id==id));
 if(id=g('epr'))return prodForm(D.pr.find(x=>x.id==id));if(id=g('adj'))return adjForm(D.pr.find(x=>x.id==id));
 if(id=g('ds')){const s=D.sa.find(x=>x.id===id);if(!s.deleted&&!confirm('이 판매를 삭제할까요?'))return;await api('/rest/v1/kr_sales?id=eq.'+id,{method:'PATCH',body:JSON.stringify({deleted:!s.deleted})});await refresh();return;}
 if(id=g('dp')){const p=D.pa.find(x=>x.id===id);if(!p.deleted&&!confirm('이 입금을 삭제할까요?'))return;await api('/rest/v1/kr_payments?id=eq.'+id,{method:'PATCH',body:JSON.stringify({deleted:!p.deleted})});await refresh();return;}
}catch(e){toast(e.message)}});
main.addEventListener('change',async ev=>{if(ev.target.id==='mSel'){MONTH=ev.target.value;render();return;}const n=ev.target.dataset?.map;if(n!=null&&ev.target.value){const p=D.pr.find(x=>x.id==ev.target.value);try{await api('/rest/v1/kr_products?id=eq.'+p.id,{method:'PATCH',body:JSON.stringify({aliases:[...(p.aliases||[]),n]})});await refresh();toast('연결됨');}catch(e){toast(e.message)}}});
nav.onclick=ev=>{const t=ev.target.dataset.tab;if(t){TAB=t;render();}};
async function doLogin(){gerr.textContent='';let id=gid.value.trim();if(!id.includes('@'))id+='@ledger.petwellbe.com';const r=await fetch(SU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email:id,password:gpw.value})});if(!r.ok){gerr.textContent='아이디 또는 비밀번호가 틀렸어요';return;}const j=await r.json();SES={a:j.access_token,r:j.refresh_token,x:Date.now()+(j.expires_in-60)*1000};localStorage.setItem('pwS',JSON.stringify(SES));gpw.value='';start();}
gbtn.onclick=doLogin;gpw.onkeydown=e=>{if(e.key==='Enter')doLogin()};
async function refresh(){if(await load())render();}
async function start(){gate.style.display='none';if(!SES){gate.style.display='block';return;}try{if(await load()){nav.style.display='flex';main.style.display='block';render();}else{gerr.textContent='한국 계정만 볼 수 있어요';SES=null;localStorage.removeItem('pwS');}}catch(e){gate.style.display='block';toast(e.message);}}
start();
lo.onclick=e=>{e.preventDefault();SES=null;localStorage.removeItem('pwS');location.reload();};
</script></body></html>
